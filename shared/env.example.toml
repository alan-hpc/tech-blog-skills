# 复制为 env.toml 并填入你自己的环境。env.toml 已在 .gitignore 中，不会被提交。
# 之所以参数化：测量环境往往是内网机器，主机名/IP/容器名不应进公开仓库。

[remote]
# 远程执行命令的模板；{cmd} 会被替换成实际命令。
# 直连 SSH:        "ssh myhost {cmd}"
# 跳板/内部工具:    "<your-tool> <host> {cmd}"
exec_template = "ssh myhost {cmd}"

# 如果被测环境在容器里，填容器名；留空表示直接在主机上跑
container = ""

# 远程工作目录，必须是绝对路径
workdir = "/path/to/bench"

[device]
vendor = "nvidia"                  # nvidia | amd | intel | other
arch_flag = "-gencode arch=compute_XXXa,code=sm_XXXa"
disasm = "cuobjdump -sass"         # 反汇编命令
query = "nvidia-smi --query-gpu=index,name,clocks.sm,utilization.gpu,driver_version --format=csv,noheader"

[measure]
trials = 31                        # 独立采样次数，奇数便于取中位数
rep_per_kernel = 256               # kernel 内重复次数
stat = "median"
